<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; }

/* الخلفية */
.bg {
    width: 100%;
    height: 100vh;
    background: url("/static/login.png") no-repeat center;
    background-size: 100% 100%;
}

/* الفورم (مكانه كما هو) */
.form {
    position: absolute;
    top: 75%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* الحقول (تكبير بسيط) */
input {
    display: block;
    margin: 14px auto;
    padding: 24px;
    width: 380px;
    font-size: 24px;

    background: rgba(255,215,0,0.75);
    border: 2px solid black;
    border-radius: 18px;
}

/* الزر (تكبير بسيط) */
button {
    margin-top: 12px;
    padding: 22px;
    width: 400px;
    font-size: 22px;

    background: teal;
    color: white;
    border: none;
    border-radius: 18px;
}
</style>
</head>

<body>

<div class="bg"></div>

<form method="POST" class="form">
    <input name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">
    <button>Login</button>
</form>

</body>
</html>
